<title>Artist Portfolio | My Art World</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;scroll-behavior:smooth}
body{background:#101014;color:#fff;font-family:Arial,sans-serif}
nav{padding:22px 7%;display:flex;justify-content:space-between;align-items:center;background:#18171e;position:sticky;top:0;z-index:5}
.logo{font-size:21px;font-weight:bold;color:#c49aff}
nav a{color:white;text-decoration:none;margin-left:15px;font-size:13px}
.hero{padding:100px 9%;min-height:65vh;background:linear-gradient(120deg,#251c36,#101014)}
.hero p{color:#c6b0dc;letter-spacing:3px}
.hero h1{font-size:clamp(40px,8vw,70px);margin:22px 0}
.hero h1 span{color:#bd91fa}
.hero h3{font-size:20px;color:#ccc;font-weight:normal}
.hero .btn{display:inline-block;margin-top:30px;padding:14px 25px;background:#9d6ee4;border-radius:30px;color:white;text-decoration:none}
section{padding:65px 8%}
.heading{text-align:center;font-size:32px;margin-bottom:12px}
